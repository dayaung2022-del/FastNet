<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FastNet Announcement</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
  }
  #announcement {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: hideAfter5s 0s linear 5s forwards;
  }
  #announcement img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  @keyframes hideAfter5s {
    to { opacity: 0; visibility: hidden; }
  }
</style>
</head>
<body>
  <div id="announcement">
    <img src="FastNet.jpg" alt="FastNet Announcement">
  </div>

  <script>
    // Hide completely after 5 seconds.
    setTimeout(function () {
      document.getElementById("announcement").style.display = "none";
    }, 5000);
  </script>
</body>
</html>
